name: SMS Bot Runner

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 365

    steps:
      - name: Checkout Private Repo (all code + data)
        uses: actions/checkout@v4
        with:
          repository: Ariful500/Test_SMS
          token: ${{ secrets.GH_PAT }}
          path: bot

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        working-directory: ./bot
        run: pip install -r requirements.txt

      - name: Run Bot (max 6 hours)
        working-directory: ./bot
        run: timeout 21600 python sms_bot.py || true

      - name: Push Updated Data
        working-directory: ./bot
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add sms_data/
          git commit -m "🔄 SMS Data Update - $(date '+%Y-%m-%d %H:%M:%S')" || echo "কোনো পরিবর্তন নেই"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
